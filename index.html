<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Álibi Express | Gerador Inteligente de Desculpas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-container">
    <header class="app-header">
      <div class="badge">✨ Gerador Instantâneo</div>
      <h1>Álibi <span>Express</span></h1>
      <p>Desculpas criativas, plausíveis e prontas a enviar em segundos.</p>
    </header>

    <section class="category-selector" aria-label="Filtrar por categoria">
      <button class="cat-btn active" data-category="todas">🎲 Todas</button>
      <button class="cat-btn" data-category="trabalho">💼 Trabalho</button>
      <button class="cat-btn" data-category="tech">💻 Tech</button>
      <button class="cat-btn" data-category="relacionamento">❤️ Amor</button>
      <button class="cat-btn" data-category="social">🎉 Social</button>
    </section>

    <section class="excuse-card" aria-live="polite">
      <div class="card-meta">
        <span id="excuse-tag" class="tag tag-todas">Pronto a gerar</span>
        <span class="credibility-box" title="Índice de credibilidade estimado">
          🎯 Credibilidade: <strong id="credibility-score">--%</strong>
        </span>
      </div>

      <div class="excuse-content">
        <p id="excuse-text" class="excuse-text">
          Clique no botão abaixo para gerar uma desculpa convincente para qualquer situação.
        </p>
      </div>

      <div class="card-footer">
        <span id="excuse-tip" class="excuse-tip">💡 Dica: Escolha uma categoria acima para filtrar.</span>
        <div class="action-buttons">
          <button id="copy-btn" class="copy-btn" disabled aria-label="Copiar desculpa">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <span id="copy-label">Copiar</span>
          </button>

          <button id="whatsapp-btn" class="whatsapp-btn" disabled aria-label="Partilhar no WhatsApp">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
            </svg>
            <span>WhatsApp</span>
          </button>
        </div>
      </div>
    </section>

    <button id="generate-btn" class="generate-btn">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"></polyline>
        <polyline points="1 20 1 14 7 14"></polyline>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
      </svg>
      Gerar Desculpa
    </button>
  </main>

  <script src="script.js"></script>
</body>
</html>
